spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/intelliatech_books?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    show-sql: false

server:
  address: 127.0.0.1

app:
  environment: sandbox
  frontend-url: http://127.0.0.1:5173
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  security:
    jwt-secret: intelliatech-local-sandbox-jwt-secret-change-before-sharing
    jwt-expiration-minutes: 60
  bootstrap:
    default-admin-enabled: true
  storage:
    local:
      enabled: true
      directory: ./uploads
      public-base-url: http://127.0.0.1:8080/uploads
    s3:
      enabled: false
      bucket: ''
      access-key-id: ''
      secret-access-key: ''
      public-base-url: ''
  einvoice:
    public-key-location: classpath:einvoice/EY_IRP_Sandbox_auth_public_key_2027.pem

# Publicly known local testing key only. Never use this key for production records.
irp:
  encryption:
    secret-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

logging:
  level:
    com.intelliatech.app: DEBUG
